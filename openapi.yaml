openapi: 3.0.3
info:
  title: Amrutam Telemedicine API
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
paths:
  /auth/register:
    post:
      summary: Register patient
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Register'}
      responses: {'201': {description: Created}, '409': {description: Conflict}}
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Login'}
      responses: {'200': {description: OK}}
  /doctors:
    get:
      summary: Search doctors
      parameters:
        - {name: specialty, in: query, schema: {type: string}}
        - {name: verified, in: query, schema: {type: boolean}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: limit, in: query, schema: {type: integer, default: 20}}
      responses: {'200': {description: OK}}
    post:
      summary: Create doctor profile
      security: [{bearerAuth: []}]
      responses: {'201': {description: Created}}
  /availability/{doctorId}:
    get:
      summary: List available slots
      parameters:
        - {name: doctorId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      responses: {'200': {description: OK}}
  /consultations/book:
    post:
      summary: Book consultation
      security: [{bearerAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotId]
              properties:
                slotId: {type: string, format: uuid}
                reason: {type: string}
      responses: {'201': {description: Created}, '409': {description: Slot conflict}}
  /consultations:
    get:
      summary: List consultations for current actor
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}}
  /consultations/{id}/status:
    patch:
      summary: Update consultation lifecycle status
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      responses: {'200': {description: OK}}
  /prescriptions/{consultationId}:
    post:
      summary: Create or update prescription
      security: [{bearerAuth: []}]
      responses: {'201': {description: Created}}
  /prescriptions/{id}:
    get:
      summary: Get prescription
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}}
  /search/doctors:
    get:
      summary: Cached doctor search
      responses: {'200': {description: OK}}
  /admin/analytics:
    get:
      summary: Admin analytics
      security: [{bearerAuth: []}]
      responses: {'200': {description: OK}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    Register:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email: {type: string, format: email}
        phone: {type: string}
        password: {type: string, minLength: 12}
        firstName: {type: string}
        lastName: {type: string}
    Login:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
        mfaCode: {type: string}
